[package]
name = "stimmenote"
version = "0.1.0"
description = "Opensource voice dictation app"
authors = ["Pratham Ghaywat"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stimmenote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5.1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
whisper-rs = { version = "0.14", features = [] }
llama-cpp-4 = { version = "0.6", default-features = false, features = ["openmp"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
dirs = "5"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.dev]
debug = 0
